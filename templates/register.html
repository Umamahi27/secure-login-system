{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<h1>Create an account</h1>
<form method="post" autocomplete="on">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Username
    <input name="username" value="{{ form.username }}" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_]+" autocomplete="username">
  </label>
  <label>Email
    <input name="email" type="email" value="{{ form.email }}" required maxlength="254" autocomplete="email">
  </label>
  <label>Password
    <input name="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password">
  </label>
  <p class="hint">At least 8 characters with upper- and lowercase letters, a digit and a symbol.</p>
  <label>Confirm password
    <input name="confirm_password" type="password" required minlength="8" maxlength="72" autocomplete="new-password">
  </label>
  <button type="submit">Register</button>
</form>
<p class="muted">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
{% endblock %}
