{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>Log in</h1>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Username
    <input name="username" value="{{ username }}" required maxlength="32" autocomplete="username" autofocus>
  </label>
  <label>Password
    <input name="password" type="password" required maxlength="72" autocomplete="current-password">
  </label>
  <button type="submit">Log in</button>
</form>
<p class="muted">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
{% endblock %}
