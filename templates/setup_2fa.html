{% extends "base.html" %}
{% block title %}Set up 2FA{% endblock %}
{% block content %}
<h1>Set up two-factor authentication</h1>
<ol>
  <li>Scan this QR code with your authenticator app.</li>
  <li>Enter the 6-digit code it shows to confirm.</li>
</ol>
<img class="qr" src="data:image/png;base64,{{ qr_data }}" alt="QR code for your authenticator app">
<p class="hint">Can't scan? Enter this key manually: <code>{{ secret }}</code></p>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Authentication code
    <input name="code" inputmode="numeric" pattern="[0-9 ]{6,7}" maxlength="7" required autocomplete="one-time-code" autofocus>
  </label>
  <button type="submit">Enable 2FA</button>
</form>
<p class="muted"><a href="{{ url_for('dashboard') }}">Cancel</a></p>
{% endblock %}
